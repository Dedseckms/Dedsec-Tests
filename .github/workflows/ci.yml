name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v test_app.py
        working-directory: server
      - run: node --check server/web/app.js
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Dedsec.Tests.Checks -c Release
      - run: dotnet publish src/Dedsec.Tests -c Release -r win-${{ matrix.arch }} --self-contained true -o artifacts/app
      - run: dotnet publish src/Dedsec.Tests.Updater -c Release -r win-${{ matrix.arch }} --self-contained true -o artifacts/app
      - uses: actions/upload-artifact@v4
        with:
          name: DedsecTests-win-${{ matrix.arch }}
          path: artifacts/app
